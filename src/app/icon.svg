<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1B1F" />
      <stop offset="100%" stop-color="#0B0C0E" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF4DC" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#6F4E02" />
    </linearGradient>
    <linearGradient id="vermilionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B4E" />
      <stop offset="100%" stop-color="#BF4E36" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Badge -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.8" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="#D4AF37" stroke-width="2" stroke-dasharray="8 6" opacity="0.3" />

  <!-- Monogram PS -->
  <g filter="url(#glow)">
    <text
      x="256"
      y="345"
      font-family="'Cormorant Garamond', 'Didot', 'Bodoni MT', 'Cinzel', Georgia, serif"
      font-size="250"
      font-weight="700"
      font-style="normal"
      letter-spacing="-8"
      text-anchor="middle"
      fill="url(#goldGrad)"
    >PS</text>
  </g>

  <!-- The Magic Message Sparkle Star -->
  <g transform="translate(370, 130)">
    <path
      d="M 0,-32 Q 0,0 32,0 Q 0,0 0,32 Q 0,0 -32,0 Q 0,0 0,-32 Z"
      fill="url(#vermilionGrad)"
    />
    <circle cx="0" cy="0" r="6" fill="#FFF2D6" />
  </g>
</svg>
